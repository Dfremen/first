<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Telegram Player</title>
    <!-- Подключаем иконки Google для кнопок плеера -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    
    <style>
        /* Фирменный стиль Spotify */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px 20px 120px 20px; /* Отступ снизу, чтобы плеер не перекрывал треки */
            overflow-y: auto;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* Список треков */
        .playlist {
            display: flex;
            季direction: column;
            flex-direction: column;
            gap: 8px;
        }

        .track-card {
            background-color: #181818;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .track-card:hover, .track-card.active {
            background-color: #282828;
        }

        .track-icon {
            color: #1DB954; /* Зеленый Spotify */
            font-size: 28px;
        }

        .track-info {
            flex-grow: 1;
        }

        .track-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .track-author {
            font-size: 13px;
            color: #b3b3b3;
        }

        /* Фиксированная нижняя панель плеера */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #181818;
            border-top: 1px solid #282828;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .current-track-name {
            font-size: 14px;
            font-weight: 500;
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .play-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        /* Полоса прогресса */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: #b3b3b3;
        }

        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background-color: #4f4f4f;
            border-radius: 2px;
            position: relative;
        }

        .progress-current {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 35%; /* Симуляция прогресса */
            background-color: #1DB954;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <h2>Мой Плейлист</h2>
    
    <!-- Сюда JavaScript будет подгружать треки -->
    <div class="playlist" id="playlist-container">
        <div style="color: #b3b3b3; text-align: center; padding: 40px;">Загрузка треков...</div>
    </div>

    <!-- Нижний плеер в стиле Spotify -->
    <div class="bottom-player">
        <div class="player-controls">
            <div class="current-track-name" id="current-title">Не выбрано</div>
            <button class="play-btn" id="main-play-btn">
                <span class="material-icons">play_arrow</span>
            </button>
        </div>
        <div class="progress-container">
            <span>1:05</span>
            <div class="progress-bar">
                <div class="progress-current"></div>
            </div>
            <span>3:40</span>
        </div>
    </div>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Раскрываем приложение на весь экран телефона

        // Получаем ID пользователя Telegram для отправки музыки
        const userId = tg.initDataUnsafe?.user?.id || 123456; 

        const API_URL = "http://192.168.0.170:8000";

        // Функция загрузки треков из нашей базы данных
        async function loadTracks() {
            try {
                let response = await fetch(`${API_URL}/api/playlist`);
                let data = await response.json();
                
                if (data.status === "success") {
                    const container = document.getElementById("playlist-container");
                    container.innerHTML = "";

                    if (data.tracks.length === 0) {
                        container.innerHTML = '<div style="color: #b3b3b3; text-align: center; padding: 40px;">Плейлист пуст. Добавьте музыку через бота!</div>';
                        return;
                    }

                    data.tracks.forEach(track => {
                        const card = document.createElement("div");
                        card.className = "track-card";
                        card.innerHTML = `
                            <span class="material-icons track-icon">play_circle_filled</span>
                            <div class="track-info">
                                <div class="track-title">${track.name}</div>
                                <div class="track-author">Telegram Audio</div>
                            </div>
                        `;

                        // При клике на карточку трека
                        card.onclick = async () => {
                            // Меняем название в нижнем плеере
                            document.getElementById("current-title").innerText = track.name;
                            
                            // Подсвечиваем активный трек
                            document.querySelectorAll('.track-card').forEach(c => c.classList.remove('active'));
                            card.classList.add('active');

                            // Меняем иконку на паузу в нижнем плеере
                            document.getElementById("main-play-btn").innerHTML = '<span class="material-icons">pause</span>';

                            // Даем команду Python-боту отправить этот трек пользователю в чат
                            await fetch(`${API_URL}/api/play`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ user_id: userId, file_id: track.file_id })
                            });
                        };

                        container.appendChild(card);
                    });
                }
            } catch (e) {
                console.error("Ошибка сети:", e);
                document.getElementById("playlist-container").innerHTML = '<div style="color: #ff5555; text-align: center; padding: 40px;">Ошибка подключения к бэкенду</div>';
            }
        }

        // Запускаем загрузку при старте страницы
        loadTracks();
    </script>
</body>
</html>
